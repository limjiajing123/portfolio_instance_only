model_list:
  - model_name: portfolio-default
    litellm_params:
      model: gemini/gemini-3.1-flash-lite-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: portfolio-fallback
    litellm_params:
      model: google/gemma-3-27b-it
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  fallbacks: [{"portfolio-default": ["portfolio-fallback"]}]
  num_retries: 2

litellm_settings:
  drop_params: true
