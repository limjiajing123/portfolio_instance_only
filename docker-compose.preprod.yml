version: "3.9"

services:
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - app-network

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.63.14-stable
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.example.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_LOCAL_MODEL_COST_MAP=True
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s    # give LiteLLM time to boot before first check
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      litellm:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - NODE_ENV=${NODE_ENV}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "82:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge