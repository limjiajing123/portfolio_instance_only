name: Production Chatbot Monitor

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  monitor-chatbot:
    runs-on: ubuntu-latest

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Ping production chatbot
        id: chatbot
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://limjiajing.com/api/chat \
            -H "Content-Type: application/json" \
            -d '{"message": "ping"}')

          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "Status: $HTTP_STATUS"
          echo "Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Chatbot returned unexpected status: $HTTP_STATUS"
            exit 1
          fi

          if ! echo "$HTTP_BODY" | jq -e '.botResponse' > /dev/null 2>&1; then
            echo "Response missing botResponse key"
            exit 1
          fi

          echo "Chatbot is healthy ✅"

      - name: Check backend health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://limjiajing.com/health)
          if [ "$STATUS" -ne 200 ]; then
            echo "Backend health check failed: $STATUS"
            exit 1
          fi
          echo "Backend healthy ✅"

      - name: Notify Discord on failure
        if: failure()
        run: |
          STATUS="❌ Production chatbot monitor failed"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(jq -n \
            --arg status "$STATUS" \
            --arg run_url "$RUN_URL" \
            '{
              "embeds": [{
                "title": $status,
                "color": 15158332,
                "description": "Your portfolio chatbot may be down. Check GitHub Actions for details.",
                "fields": [
                  {"name": "Site", "value": "https://limjiajing.com"},
                  {"name": "Workflow Run", "value": $run_url}
                ],
                "footer": {"text": "Portfolio Monitor • every 6 hours"}
              }]
            }')

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$DISCORD_WEBHOOK_URL"