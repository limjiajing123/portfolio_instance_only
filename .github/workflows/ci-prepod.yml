name: Preproduction CI Smoke Tests

on:
  push:
    branches:
      - preproduction

jobs:
  preprod-tests:
    runs-on: ubuntu-latest

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3. Install test dependencies
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests requests-mock mcp==1.9.0

      # 4. Build & start services
      - name: Start services with docker compose
        run: |
          NODE_ENV=test docker compose -f docker-compose.preprod.yml up -d --build

          # Wait for LiteLLM
          echo "Waiting for LiteLLM..."
          for i in {1..20}; do
            if curl -s http://localhost:4000/health > /dev/null 2>&1; then
              echo "LiteLLM is up ✅"
              break
            fi
            echo "Attempt $i/20 — waiting..."
            sleep 5
          done

          # Wait for MCP server
          echo "Waiting for MCP server..."
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 \
              -X POST http://localhost:8000/mcp \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"test","version":"1.0"}}}')
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "400" ] || [ "$STATUS" = "405" ]; then
              echo "MCP server is up ✅"
              break
            fi
            echo "Attempt $i/15 — waiting... (status: $STATUS)"
            sleep 3
          done
        
          # Wait for backend
          echo "Waiting for backend..."
          for i in {1..10}; do
            if curl -s http://localhost:5000/health | grep -q "ok"; then
              echo "Backend healthy ✅"
              break
            fi
            echo "Waiting for backend..."
            sleep 3
          done

          docker ps -a
          echo "=== BACKEND LOGS ==="
          docker logs backend
          echo "=== MCP LOGS ==="
          docker logs mcp-server

      # 5. Run unit tests (mocked, fast, no LLM)
      - name: Run unit tests
        run: |
          export NODE_ENV=test
          pytest -v tests/test_backend.py tests/test_frontend.py

      # 6. Run MCP integration tests (real MCP server, no LLM)
      - name: Run MCP integration tests
        run: |
          pytest -v tests/test_mcp.py

      # 7. Run smoke tests (health checks only)
      - name: Run smoke tests
        run: |
          pytest -v tests/smoke_test.py

      # 8. Tear down
      - name: Shutdown services
        if: always()
        run: docker compose -f docker-compose.preprod.yml down

      # 9. Trigger deploy workflow if preprod passes
      - name: Trigger Deploy Workflow
        if: ${{ success() }}
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: "deploy.yml"
          ref: main
          token: ${{ secrets.GH_PAT }}

      # 10. Notify Discord
      - name: Notify Discord
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            STATUS="✅ Deployment succeeded!"
          else
            COLOR=15158332
            STATUS="❌ Deployment failed!"
          fi

          PAYLOAD=$(jq -n \
            --arg status "$STATUS" \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson color "$COLOR" \
            '{
              "embeds": [{
                "title": $status,
                "color": $color,
                "fields": [
                  {"name": "Repository", "value": $repo, "inline": true},
                  {"name": "Branch", "value": $branch, "inline": true},
                  {"name": "Triggered by", "value": $actor, "inline": true},
                  {"name": "Workflow Run", "value": $run_url, "inline": false}
                ],
                "footer": {"text": "GitHub Actions • Deploy Workflow"}
              }]
            }'
          )

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               ${{ secrets.DISCORD_WEBHOOK_URL }}